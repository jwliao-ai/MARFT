experiment_name: deepcoder-3agent-anonymous
trial_name: trial1

seed: 1
enable_offload: false
total_train_epochs: 50
tokenizer_path: ${actor.path}

# ---------------------------------------------------------------------------
# Anonymous variant: agents have no specialized roles or system prompts.
# All agents share the same generic coding-problem prompt.
# Used with examples/deepcoder/deepcoder_ma_lora.py.
# ---------------------------------------------------------------------------

multi_agent:
  graph_type: sequential
  use_multi_lora: true
  shared_lora: true
  lora_name_prefix: agent
  role_names:
    - agent_1
    - agent_2
    - agent_3
  role_configs:
    agent_1:
      name: agent_1
      system_prompt: >
        You are the 1st agent in a multi-agent coding problem solving team.
        Work on the coding problem based on the conversation so far.
        Enclose your final solution within ```python ... ``` delimiters.
      description: The 1st agent in the sequential pipeline.
    agent_2:
      name: agent_2
      system_prompt: >
        You are the 2nd agent in a multi-agent coding problem solving team.
        Work on the coding problem based on the conversation so far.
        Enclose your final solution within ```python ... ``` delimiters.
      description: The 2nd agent in the sequential pipeline.
    agent_3:
      name: agent_3
      system_prompt: >
        You are the 3rd agent in a multi-agent coding problem solving team.
        Work on the coding problem based on the conversation so far.
        Enclose your final solution within ```python ... ``` delimiters.
      description: The 3rd agent in the sequential pipeline.
  credit_strategy: equal
  credit_discount: 1.0
  reward_sharing: true
  independent_critic: null
  shared_policy: true
  enable_thinking: false
  dump_transcripts: true

cluster:
  n_nodes: 1
  n_gpus_per_node: 4
  fileroot: /inspire/hdd/project/multi-agent/liaojunwei-p-liaojunwei/codes/synergy-marft/AReaL-MARFT/ecmlp_experiments
  name_resolve:
    type: nfs
    nfs_record_root: /inspire/hdd/project/multi-agent/liaojunwei-p-liaojunwei/codes/synergy-marft/AReaL-MARFT/ecmlp_experiments/name_resolve

allocation_mode: sglang:d2p1t1+d2p1t1

scheduler:
  type: null

rollout:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 32
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 2
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  use_lora: true

gconfig:
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: 9216
  greedy: false
  temperature: 1.0
  lora_name: default

eval_gconfig:
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: 9216
  greedy: false
  temperature: 1.0

actor:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: /inspire/hdd/project/multi-agent/liaojunwei-p-liaojunwei/models/Qwen2.5-3B-Instruct
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  weight_update_mode: disk
  mb_spec:
    max_tokens_per_mb: 32768
  optimizer:
    type: adam
    lr: 1.7e-05
    weight_decay: 0.017
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
    min_lr_ratio: 0.0
  eps_clip: 0.2
  temperature: ${gconfig.temperature}
  reward_scaling: 10.0
  reward_bias: -0.5
  kl_ctl: 0.0
  kl_estimator: k1
  reward_sharing: ${multi_agent.reward_sharing}
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  behav_imp_weight_cap: 5.0
  reward_norm:
    mean_level: batch
    std_level: batch
    group_size: ${gconfig.n_samples}
  adv_norm:
    mean_level: batch
    std_level: batch
  max_new_tokens: ${gconfig.max_new_tokens}
  use_lora: true
  peft_type: lora
  lora_rank: 32
  lora_alpha: 16
  target_modules: [all-linear]
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 32
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars: {}

ref:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 32768
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

critic:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  is_critic: true
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 32768
  optimizer:
    type: adam
    lr: 1.7e-05
    weight_decay: 0.017
    gradient_clipping: 1.0
  ppo_n_minibatches: 1
  eps_clip: 0.5
  use_lora: true
  peft_type: ${actor.peft_type}
  lora_rank: ${actor.lora_rank}
  lora_alpha: ${actor.lora_alpha}
  target_modules: ${actor.target_modules}
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 32768
  mem_fraction_static: 0.8
  enable_lora: ${actor.use_lora}
  max_lora_rank: ${actor.lora_rank}
  lora_target_modules: ${actor.target_modules}
  schedule_policy: fcfs
  max_loaded_loras: 5
  max_loras_per_batch: 4

train_dataset:
  batch_size: 256
  shuffle: true
  pin_memory: true
  num_workers: 4
  path: /inspire/hdd/project/multi-agent/liaojunwei-p-liaojunwei/data/DeepCoder-Preview-Dataset
  type: rl
  max_length: 4096

valid_dataset:
  batch_size: 256
  pin_memory: true
  num_workers: 4
  path: /inspire/hdd/project/multi-agent/liaojunwei-p-liaojunwei/data/DeepCoder-Preview-Dataset
  type: rl

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 100
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 100
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
  tensorboard:
    path: "/inspire/hdd/project/multi-agent/liaojunwei-p-liaojunwei/codes/synergy-marft/AReaL-MARFT/ecmlp_experiments/tensorboard/${experiment_name}/${trial_name}"

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
